# pnpm 12 does not run a dependency's install scripts unless it is listed
# here, and fails the install on one that is not listed at all.
#
# Generated by the studio export from the monorepo's own allowlist. Edits
# here are overwritten on the next release.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: false
